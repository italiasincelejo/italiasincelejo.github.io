name: prueba-vista-previa
on:
  push:
    branches: [fuentes]
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pedir las páginas como WhatsApp
        run: |
          mkdir -p prueba; UA="WhatsApp/2.24.20.80 A"
          for u in "https://italiasincelejo.github.io/" "https://italiasincelejo.github.io/og-italia.jpg?v=2" "https://italiasincelejo.github.io/og-image.png" "https://einerjoseperez2021-debug.github.io/italia-arma-tu-pizza/" "https://einerjoseperez2021-debug.github.io/italia-arma-tu-pizza/og-image.png"; do
            echo "=== $u" >> prueba/resultado.txt
            curl -sS -A "$UA" -o /tmp/body -D - -w "tiempo %{time_total}s bytes %{size_download}\n" "$u" | grep -iE "^HTTP|content-type|content-length|location|cache-control|tiempo" >> prueba/resultado.txt
            head -c 1500 /tmp/body | grep -o '<meta[^>]*og:[^>]*>' >> prueba/resultado.txt || true
          done
      - name: Guardar
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add prueba; git commit -m "Prueba vista previa" || true; git push
