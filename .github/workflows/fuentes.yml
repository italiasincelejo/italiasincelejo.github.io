name: voz
on:
  push:
    branches: [fuentes]
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar voz (Kokoro, código abierto Apache-2.0)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          pip install -q "kokoro>=0.9.4" soundfile torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Generar las frases
        run: python voz/generar.py
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add voz/*.wav
          git commit -m "Voz del reel" || true
          git push
