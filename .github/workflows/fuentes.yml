name: transcribir
on:
  push:
    branches: [fuentes]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q faster-whisper
      - name: Transcribir con tiempos por palabra
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          segs, info = m.transcribe("voz/hermano.mp3", language="es", word_timestamps=True, vad_filter=False)
          with open("voz/transcripcion.txt","w") as f:
              for s in segs:
                  f.write(f"[{s.start:6.2f}-{s.end:6.2f}] {s.text}\n")
                  for w in s.words: f.write(f"    {w.start:6.2f}-{w.end:6.2f} {w.word}\n")
          PY
          cat voz/transcripcion.txt
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add voz/transcripcion.txt; git commit -m "Transcripcion" || true; git push
