name: fotos
on:
  push:
    branches: [fuentes]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fotos de los ingredientes
        run: |
          while read name url; do curl -sSL -A "Mozilla/5.0" "$url" -o "fotos/$name.png"; echo "$name $(stat -c %s fotos/$name.png) $(file -b fotos/$name.png | cut -c1-40)"; done < fotos/urls.txt
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add fotos/*.png
          git commit -m "Fotos de ingredientes" || true
          git push
